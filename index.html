<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stok Jajanan</title>
<meta name="theme-color" content="#0f7b5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stok Jajanan">

<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1b18;--mu:#6b685f;--bd:#e3e0d6;--ac:#0f7b5f;--on:#fff;--rd:#c0392b;--rdb:#fdecea;--yl:#8a5a00;--ylb:#fff1cc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151512;--card:#201f1b;--tx:#f0eee6;--mu:#a09c90;--bd:#38362f;--ac:#3fc59d;--on:#08251c;--rd:#ff8a7a;--rdb:#3a1f1b;--yl:#ffc659;--ylb:#3b2f10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151512;--card:#201f1b;--tx:#f0eee6;--mu:#a09c90;--bd:#38362f;--ac:#3fc59d;--on:#08251c;--rd:#ff8a7a;--rdb:#3a1f1b;--yl:#ffc659;--ylb:#3b2f10;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{padding:0 12px 90px;max-width:640px;margin:0 auto}
h1{font-size:20px;margin:14px 0 8px}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.bar{display:flex;gap:8px;margin:8px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.btn{padding:11px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;white-space:nowrap;text-decoration:none;text-align:center;display:inline-block}
.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn.del{color:var(--rd)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.nm{background:none;border:0;color:var(--tx);font:inherit;font-weight:600;text-align:left;padding:0;flex:1}
.un{color:var(--mu);font-size:13px;font-weight:400}
.st{display:flex;gap:6px}
.st button{padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;font-size:14px;font-weight:600}
.st .h.on{background:var(--rdb);color:var(--rd);border-color:var(--rd)}
.st .t.on{background:var(--ylb);color:var(--yl);border-color:var(--yl)}
.step{display:flex;align-items:center;gap:8px;margin-top:8px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.step b{min-width:44px;text-align:center;font-size:18px}
.step span{color:var(--mu);font-size:14px}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
.msg{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.hide{display:none}
</style></head><body>
<h1>🍬 Stok Jajanan</h1>
<div class="tabs"><button id="ta" class="on">Barang</button><button id="tb">Belanja</button></div>

<div id="pa">
  <div class="bar"><input id="q" placeholder="Cari barang…" autocomplete="off"><button class="btn pri" id="add">+ Baru</button></div>
  <div id="list"></div>
</div>

<div id="pb" class="hide">
  <div id="shop"></div>
  <label for="wa">Nomor WA grosir (opsional)</label>
  <input id="wa" inputmode="tel" placeholder="08123456789">
  <div class="msg" id="msg"></div>
  <div class="acts">
    <a class="btn pri" id="send" target="_blank" rel="noopener">Kirim ke WhatsApp</a>
    <button class="btn" id="copy">Salin teks</button>
  </div>
  <div class="acts" style="margin-top:8px"><button class="btn del" id="done">Selesai belanja (kosongkan)</button></div>
</div>

<div class="modal" id="md"><div class="sheet">
  <b id="mt">Barang baru</b>
  <label for="f1">Nama barang</label><input id="f1" placeholder="Roma Kelapa">
  <label for="f2">Satuan</label>
  <select id="f2"><option>pcs</option><option>renceng</option><option>pack</option><option>box</option><option>dus</option><option>bal</option></select>
  <label for="f3">Jumlah belanja biasa</label><input id="f3" type="number" min="1" value="1" inputmode="numeric">
  <div class="acts" style="margin-top:14px">
    <button class="btn" id="fc">Batal</button><button class="btn del" id="fd">Hapus</button><button class="btn pri" id="fs">Simpan</button>
  </div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const seed=[["Roma Kelapa","renceng",5],["Roma Malkist Abon","renceng",5],["Nabati Richeese","renceng",3],["Nabati Wafer Coklat","renceng",3]];
let S={items:[],wa:""},editId=null,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
try{const d=JSON.parse(localStorage.getItem("stokjajan")||"null");if(d){S.items=d.items||[];S.wa=d.wa||""}}catch(e){}
if(!S.items.length&&!localStorage.getItem("stokjajan_init")){S.items=seed.map(s=>({id:uid(),name:s[0],unit:s[1],def:s[2],st:null,qty:0}))}
function save(){try{localStorage.setItem("stokjajan",JSON.stringify(S));localStorage.setItem("stokjajan_init","1")}catch(e){}}
const find=id=>S.items.find(i=>i.id===id);
const byName=(a,b)=>a.name.localeCompare(b.name,"id");

function stepper(i){return `<div class="step"><button data-a="m" data-id="${i.id}">−</button><b>${i.qty}</b><button data-a="p" data-id="${i.id}">+</button><span>${esc(i.unit)}</span></div>`}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function render(){
  const q=$("q").value.trim().toLowerCase();
  const arr=S.items.filter(i=>i.name.toLowerCase().includes(q)).sort((a,b)=>(!!b.st-!!a.st)||byName(a,b));
  $("list").innerHTML=arr.length?arr.map(i=>`<div class="row"><div class="top"><button class="nm" data-a="e" data-id="${i.id}">${esc(i.name)} <span class="un">· ${esc(i.unit)}</span></button><div class="st"><button class="h ${i.st==="h"?"on":""}" data-a="h" data-id="${i.id}">Habis</button><button class="t ${i.st==="t"?"on":""}" data-a="t" data-id="${i.id}">Tipis</button></div></div>${i.st?stepper(i):""}</div>`).join(""):`<div class="empty">Belum ada barang. Tap “+ Baru” untuk menambah.</div>`;
  const need=S.items.filter(i=>i.st).sort(byName);
  $("tb").textContent="Belanja"+(need.length?" ("+need.length+")":"");
  $("shop").innerHTML=need.length?need.map(i=>`<div class="row"><div class="top"><b>${esc(i.name)} ${i.st==="h"?"🔴":"🟡"}</b><button class="btn del" data-a="x" data-id="${i.id}">Hapus</button></div>${stepper(i)}</div>`).join(""):`<div class="empty">Daftar belanja kosong. Tandai barang “Habis” atau “Tipis” di tab Barang.</div>`;
  const m=build();$("msg").textContent=need.length?m:"—";
  $("send").href=need.length?link(m):"#";
  $("send").style.opacity=$("copy").style.opacity=need.length?1:.4;
}
function build(){
  const need=S.items.filter(i=>i.st).sort(byName);
  const t=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  return "Assalamualaikum, mohon disiapkan barang berikut ("+t+"):\n\n"+need.map((i,n)=>(n+1)+". "+i.name+" – "+i.qty+" "+i.unit).join("\n")+"\n\nNanti saya ambil. Terima kasih 🙏";
}
function link(m){
  let n=S.wa.replace(/\D/g,"");if(n.startsWith("0"))n="62"+n.slice(1);
  return "https://wa.me/"+n+"?text="+encodeURIComponent(m);
}
function tab(b){$("pa").classList.toggle("hide",b);$("pb").classList.toggle("hide",!b);$("ta").classList.toggle("on",!b);$("tb").classList.toggle("on",b)}
$("ta").onclick=()=>tab(false);$("tb").onclick=()=>tab(true);
$("q").oninput=render;
$("wa").value=S.wa;$("wa").oninput=e=>{S.wa=e.target.value;save();render()};

document.body.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const i=find(b.dataset.id),a=b.dataset.a;if(!i)return;
  if(a==="h"||a==="t"){if(i.st===a)i.st=null;else{i.st=a;if(!i.qty)i.qty=i.def||1}}
  else if(a==="p")i.qty++;
  else if(a==="m")i.qty=Math.max(1,i.qty-1);
  else if(a==="x")i.st=null;
  else if(a==="e"){openM(i.id);return}
  save();render();
});

function openM(id){
  editId=id;const i=id&&find(id);
  $("mt").textContent=i?"Ubah barang":"Barang baru";
  $("f1").value=i?i.name:"";$("f2").value=i?i.unit:"pcs";$("f3").value=i?i.def:1;
  $("fd").classList.toggle("hide",!i);$("md").classList.add("show");setTimeout(()=>$("f1").focus(),50);
}
$("add").onclick=()=>openM(null);
$("fc").onclick=()=>$("md").classList.remove("show");
$("fs").onclick=()=>{
  const name=$("f1").value.trim();if(!name){$("f1").focus();return}
  const def=Math.max(1,parseInt($("f3").value)||1),unit=$("f2").value;
  if(editId){const i=find(editId);i.name=name;i.unit=unit;i.def=def}
  else S.items.push({id:uid(),name,unit,def,st:null,qty:0});
  save();$("md").classList.remove("show");render();
};
$("fd").onclick=()=>{
  if($("fd").dataset.c){S.items=S.items.filter(i=>i.id!==editId);save();$("md").classList.remove("show");$("fd").textContent="Hapus";delete $("fd").dataset.c;render();return}
  $("fd").dataset.c=1;$("fd").textContent="Yakin hapus?";
  setTimeout(()=>{$("fd").textContent="Hapus";delete $("fd").dataset.c},3000);
};
$("copy").onclick=async()=>{
  const m=build();
  try{await navigator.clipboard.writeText(m)}catch(e){const t=document.createElement("textarea");t.value=m;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(_){}t.remove()}
  $("copy").textContent="Tersalin ✓";setTimeout(()=>$("copy").textContent="Salin teks",1500);
};
$("done").onclick=()=>{
  if($("done").dataset.c){S.items.forEach(i=>{i.st=null;i.qty=0});save();render();$("done").textContent="Selesai belanja (kosongkan)";delete $("done").dataset.c;return}
  $("done").dataset.c=1;$("done").textContent="Yakin? Tap sekali lagi";
  setTimeout(()=>{$("done").textContent="Selesai belanja (kosongkan)";delete $("done").dataset.c},3000);
};
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script></body></html>
